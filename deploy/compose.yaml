# Production on one small VM (Google Cloud e2-micro: 2 shared vCPUs, 1 GB RAM).
# Secrets come from deploy/.env, which never enters the repository.
name: rolehound

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_DB: rolehound
      POSTGRES_USER: rolehound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Sized for three people on 1 GB of RAM.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolehound -d rolehound"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    # Built and pushed by CI (.github/workflows/ci.yml). API_TAG is the commit SHA to run:
    # an exact build, never whatever "main" points to at pull time.
    image: ghcr.io/mj01px/rolehound-api:${API_TAG:?set API_TAG in .env to a commit SHA built by CI}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Rolehound: Host=postgres;Database=rolehound;Username=rolehound;Password=${POSTGRES_PASSWORD};Maximum Pool Size=15
      Database__MigrateOnStart: "true"
      Proxy__Trusted: "true"
    # No published port: only Caddy reaches the API, which is why forwarded headers are trusted.
    expose:
      - "8080"
    mem_limit: 400m
    healthcheck:
      # The runtime image has bash but no curl; /dev/tcp is a bash feature, hence "bash -c".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m

  # Calls the API's scheduled tasks; the API decides whether a run is due.
  scheduler:
    # A small image with curl and tzdata baked in (scheduler/Dockerfile), built on the VM once.
    build: ./scheduler
    image: rolehound-scheduler
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TASKS_KEY: ${Tasks__Key:?set Tasks__Key in .env}
      TZ: America/Sao_Paulo
    volumes:
      - ./scheduler/crontab:/etc/crontabs/root:ro
      - ./scheduler/task.sh:/usr/local/bin/task.sh:ro
    command: ["crond", "-f", "-l", "6"]
    mem_limit: 32m

  # Daily compressed dump kept on the VM disk for 7 days (see README, Backups).
  backup:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - ./dump/backup.sh:/usr/local/bin/backup.sh:ro
      - ./dump/crontab:/etc/crontabs/root:ro
      - backups:/backups
    command: ["crond", "-f", "-l", "6"]
    mem_limit: 64m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  backups:
